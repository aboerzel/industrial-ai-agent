  [mcp_servers.pycharm]
    url = "http://127.0.0.1:64462/stream"

[mcp_servers.factory]
url = "http://localhost:8001/mcp"
bearer_token_env_var = "MCP_CODEX_DEVELOPMENT_TOKEN"
enabled_tools = ["get_product_history", "get_machine_status"]
disabled_tools = ["create_maintenance_ticket"]

[mcp_servers.knowledge]
url = "http://localhost:8002/mcp"
bearer_token_env_var = "MCP_CODEX_DEVELOPMENT_TOKEN"
enabled_tools = ["search_documentation"]

[mcp_servers.observability]
url = "http://localhost:8003/mcp"
bearer_token_env_var = "MCP_CODEX_DEVELOPMENT_TOKEN"
enabled_tools = ["get_run_trace", "get_trace_logs", "get_run_metrics", "get_service_health", "investigate_run"]

[mcp_servers.runtime]
url = "http://localhost:8004/mcp"
bearer_token_env_var = "MCP_CODEX_DEVELOPMENT_TOKEN"
enabled_tools = ["get_agent_run", "get_run_tool_trajectory", "get_run_approval", "get_run_failure", "list_recent_agent_runs"]

[mcp_servers.rca]
url = "http://localhost:8005/mcp"
bearer_token_env_var = "MCP_CODEX_DEVELOPMENT_TOKEN"
enabled_tools = ["analyze_run"]
