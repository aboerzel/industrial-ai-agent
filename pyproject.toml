[project]
name = "industrial-ai-agent"
version = "0.1.0"
description = "Industrial Agentic AI learning and portfolio project"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1,<0.142",
    "httpx>=0.28,<1.0",
    "httpx2>=2.0,<3.0",
    "langchain-core>=1.2,<2.0",
    "langchain-ollama>=1.0,<2.0",
    "langgraph>=1.2,<2.0",
    "mcp>=2.0,<3.0",
    "numpy>=2.0",
    "openai>=1.0,<3.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "sentence-transformers>=5.0,<6.0",
    "uvicorn>=0.52.4,<0.53",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
