[project]
name = "industrial-ai-agent"
version = "0.1.0"
description = "Industrial Agentic AI learning and portfolio project"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1,<1.20",
    "docling>=2.125.0,<2.126",
    "fastapi>=0.141.1,<0.142",
    "httpx>=0.28,<1.0",
    "httpx2>=2.0,<3.0",
    "langchain-core>=1.2,<2.0",
    "langchain-ollama>=1.0,<2.0",
    "langfuse>=4.15,<5.0",
    "langgraph>=1.2,<2.0",
    "langgraph-checkpoint-postgres>=3.1.2,<3.2",
    "mcp>=2.0,<3.0",
    "numpy>=2.0",
    "openai>=1.0,<3.0",
    "opentelemetry-api>=1.44.0,<1.45",
    "opentelemetry-exporter-otlp-proto-grpc>=1.44.0,<1.45",
    "opentelemetry-instrumentation-fastapi>=0.65b0,<0.66",
    "opentelemetry-instrumentation-asgi>=0.65b0,<0.66",
    "opentelemetry-sdk>=1.44.0,<1.45",
    "pydantic>=2.0",
    "reportlab>=4.4,<5.0",
    "psycopg[binary]>=3.3.5,<3.4",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0.52,<2.1",
    "sentence-transformers>=5.0,<6.0",
    "uvicorn>=0.52.4,<0.53",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
