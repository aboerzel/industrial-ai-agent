map $remote_user $demo_api_authorization {
    default "";
    ~^public$ "Bearer ${MCP_INDUSTRIAL_AGENT_PUBLIC_TOKEN}";
    ~^internal$ "Bearer ${MCP_INDUSTRIAL_AGENT_INTERNAL_TOKEN}";
    ~^confidential$ "Bearer ${MCP_INDUSTRIAL_AGENT_TOKEN}";
    ~^restricted$ "Bearer ${MCP_INDUSTRIAL_AGENT_RESTRICTED_TOKEN}";
    ~^model-admin$ "Bearer ${AGENT_API_MODEL_ADMIN_TOKEN}";
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    auth_basic "Industrial AI Agent demo";
    auth_basic_user_file /etc/nginx/auth/frontend.htpasswd;

    # Keep credentials out of access/error logs, including invalid usernames.
    access_log off;
    error_log /dev/null;

    location = /health {
        auth_basic off;
        return 200 "ok\n";
    }

    location ^~ /api/ {
        proxy_pass http://agent-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Authorization $demo_api_authorization;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }

    location = / {
        add_header Cache-Control "no-store";
        try_files /index.html =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location ~ \.mjs$ {
        add_header Cache-Control "no-cache, must-revalidate";
        default_type application/javascript;
        try_files $uri =404;
    }

    location ~* \.(?:css|js)$ {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
