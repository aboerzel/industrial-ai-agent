<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Local browser client for the Industrial AI Agent API."
    />
    <title>Industrial AI Agent</title>
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <main class="shell">
      <header class="site-header">
        <p class="eyebrow">LOCAL DEMO / CLASSIFIED DATA</p>
        <h1>Industrial AI Agent</h1>
        <p class="subtitle">
          Troubleshooting assistant using LangGraph and MCP-based industrial services.
        </p>
      </header>

      <section class="result-panel" aria-labelledby="result-title">
        <header class="investigation-header">
          <div class="investigation-title">
            <h2 id="result-title">Investigation</h2>
          </div>
          <div class="toolbar-controls">
            <div class="toolbar-selectors">
              <label class="clearance-control" for="user-clearance" title="Demo access level for the next request.">
                <span>Demo clearance</span>
                <select id="user-clearance" name="user-clearance">
                  <option value="PUBLIC" selected>PUBLIC</option>
                  <option value="INTERNAL">INTERNAL</option>
                  <option value="CONFIDENTIAL">CONFIDENTIAL</option>
                  <option value="RESTRICTED">RESTRICTED</option>
                </select>
              </label>
              <label class="clearance-control" for="response-language" title="Language for the next agent response.">
                <span>Response language</span>
                <select id="response-language" name="response-language">
                  <option value="DE">Deutsch</option>
                  <option value="EN" selected>English</option>
                </select>
              </label>
            </div>
            <div class="toolbar-actions">
              <span class="status-badge" data-status="idle" id="run-status" hidden></span>
              <button class="secondary-button icon-button" id="model-configuration-button" type="button" title="Model configuration" aria-label="Model configuration">
                <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7ZM19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.12 2.12-.06-.06a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1.03 1.56V20h-3v-.08A1.7 1.7 0 0 0 10.68 18.36a1.7 1.7 0 0 0-1.88.34l-.06.06-2.12-2.12.06-.06A1.7 1.7 0 0 0 7.02 14.7 1.7 1.7 0 0 0 5.46 13.67H5.4v-3h.08A1.7 1.7 0 0 0 7.04 9.64a1.7 1.7 0 0 0-.34-1.88l-.06-.06 2.12-2.12.06.06a1.7 1.7 0 0 0 1.88.34 1.7 1.7 0 0 0 1.03-1.56V4.4h3v.08a1.7 1.7 0 0 0 1.03 1.56 1.7 1.7 0 0 0 1.88-.34l.06-.06 2.12 2.12-.06.06a1.7 1.7 0 0 0-.34 1.88 1.7 1.7 0 0 0 1.56 1.03h.08v3h-.08A1.7 1.7 0 0 0 19.4 15Z" /></svg>
                <span class="visually-hidden">Model configuration</span>
              </button>
              <button class="compact-button" id="export-pdf-button" type="button" disabled title="Export investigation as PDF">
                <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M6 2h8l4 4v16H6zM14 2v5h5M12 11v7m-3-3 3 3 3-3" /></svg>
                <span>PDF</span>
              </button>
              <button class="secondary-button compact-button" id="new-investigation-button" type="button" title="Start a new chat">
                <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></svg>
                <span>New Chat</span>
              </button>
            </div>
          </div>
        </header>

        <div class="conversation-history empty-state" id="conversation-history" aria-live="polite" aria-relevant="additions text">
          <div class="empty-investigation">
            <h3>Start a new chat</h3>
            <p>Ask about a production issue, station, product, maintenance ticket, or available documentation.</p>
          </div>
        </div>

        <form class="composer-form" id="composer-form">
          <label for="composer-message">Message</label>
          <div class="composer-input-row">
            <textarea id="composer-message" name="composer-message" rows="3" placeholder="Ask a troubleshooting question..." required></textarea>
            <button id="composer-button" type="submit" aria-label="Send message" title="Send message">
              <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m3 11 18-8-8 18-2-8zM11 13l10-10" /></svg>
              <span class="visually-hidden">Send</span>
            </button>
          </div>
        </form>

        <p class="error-message" hidden id="error-message" role="alert"></p>
      </section>
    </main>
    <dialog class="model-configuration-dialog" id="model-configuration-dialog" aria-labelledby="model-configuration-title">
      <header class="model-configuration-header">
        <div><p class="eyebrow">SETTINGS</p><h2 id="model-configuration-title">Model Configuration</h2></div>
        <button class="secondary-button icon-button" id="model-configuration-close" type="button" aria-label="Close model configuration" title="Close">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18" /></svg>
        </button>
      </header>
      <div id="model-configuration-content" class="model-configuration-content" aria-live="polite"></div>
    </dialog>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
